  host. Nothing StoragePug itself publishes was found: every /.well-known/ path
  on www.storagepug.com, api.storagepug.com and app.storagepug.com returned 404.
  One 200 was recorded - a security.txt on help.storagepug.com - but it is NOT
  StoragePug's document. It is Intercom's own security.txt, served because the
  help center is hosted on Intercom, and its Canonical field points at
  https://app.intercom.com/.well-known/security.txt. Crediting StoragePug with a
  vendor's security.txt would be a false positive, so no WellKnown or SecurityTxt
  pointer is emitted in apis.yml for this probe.
