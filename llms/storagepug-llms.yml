description: >-
  StoragePug serves a real llms.txt at https://help.storagepug.com/llms.txt,
  saved verbatim to llms/storagepug-llms.txt. It is an index of the StoragePug
  Help Center - 130+ linked articles grouped under Onboarding, Insights
  Dashboard, Websites, Marketing Best Practices and General - with each entry
  pointing at a `.md` rendering of the article. It is operator-facing product
  documentation, not developer documentation: there is no API reference, no
  endpoint list, and no authentication section in it. The closest thing to a
  programmatic surface it names is "Creating SiteLink API User", which walks a
  facility through issuing StoragePug credentials to the facility's own SiteLink
  PMS API - StoragePug consuming someone else's API, not publishing one.
provenance_note: >-
  The file is generated by the Intercom help-center platform that hosts
  help.storagepug.com, but it is served from StoragePug's own subdomain and
  indexes StoragePug's own content, so it is credited to StoragePug. This is a
  different case from the security.txt on the same host, which is Intercom's own
  document canonicalized to app.intercom.com and is therefore NOT credited - see
  well-known/storagepug-well-known.yml.
