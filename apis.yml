name: StoragePug
kind: company
description: >-
  StoragePug builds marketing websites, online rental/reservation flows, and
  lead-management dashboards for self-storage facility operators. StoragePug
  has no public, self-service developer portal, no published REST/GraphQL API
  reference, and no OpenAPI specification of its own. Its documented
  programmatic surface runs the other direction: StoragePug is a licensed
  integration partner that consumes property-management-system APIs -
  primarily SiteLink's API, with additional PMS partners such as CallPotential
  and OpenTech Alliance/StorageTreasures - to pull unit rates, availability,
  and tenant data into the facility websites it builds, and to push back
  online rentals, reservations, and payments. No webhook system, API key
  management screen, or Zapier app for StoragePug itself was found. This entry
  is documented as a stub because there is no public API to catalog.
