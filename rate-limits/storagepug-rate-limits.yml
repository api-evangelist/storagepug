description: >-
  StoragePug publishes no rate limits, because it publishes no public API. The
  help center, the marketing site and the plans/partnership page contain no
  quota, throttle, burst or 429 policy of any kind, and there is no developer
  documentation on any StoragePug host to carry one. The one live first-party
  API host found during contract discovery, api.storagepug.com, is the
  undocumented backend for the Insights dashboard at app.storagepug.com; it
  returns no RateLimit-* or X-RateLimit-* headers on the anonymous responses it
  will serve, and no published policy describes it.
